body{background-size:cover;background-position:center}

/* Procedural equirectangular (2:1) space sky. Nebula noise is sampled on the SPHERE, so the left/right edges
   wrap seamlessly and there is no pinching at the poles. Palette: black, charcoal, dusty rose, muted purple,
   copper, amber, white stars and the odd cool-blue star. Used only when SKY_URL cannot be loaded. */
function makeSkyCanvas(W, H) {
  let seed = 7319; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const perm = new Uint8Array(512), p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0, t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

  function vn(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = fade(x - xi), yf = fade(y - yi), zf = fade(z - zi);
    return mix(
      mix(mix(hh(xi, yi, zi), hh(xi + 1, yi, zi), xf), mix(hh(xi, yi + 1, zi), hh(xi + 1, yi + 1, zi), xf), yf),
      mix(mix(hh(xi, yi, zi + 1), hh(xi + 1, yi, zi + 1), xf), mix(hh(xi, yi + 1, zi + 1), hh(xi + 1, yi + 1, zi + 1), xf), yf), zf);
  }
  const fbm = (x, y, z, o) => { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * vn(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; };
  const PAL = [[84, 64, 118], [190, 128, 140], [196, 108, 58], [232, 168, 84]];   /* muted purple, dusty rose, copper, amber */

  /* nebula at half resolution (it is soft), then scaled up */
  const nw = W >> 1, nh = H >> 1, small = document.createElement("canvas"); small.width = nw; small.height = nh;
  const sg = small.getContext("2d"), img = sg.createImageData(nw, nh), px = img.data;
  for (let y = 0; y < nh; y++) {
    const lat = (.5 - (y + .5) / nh) * Math.PI, cl = Math.cos(lat), dy = Math.sin(lat);
    for (let x = 0; x < nw; x++) {
      const lon = (x + .5) / nw * Math.PI * 2, dx = cl * Math.cos(lon), dz = cl * Math.sin(lon);
      const w = fbm(dx * 1.3 + 7, dy * 1.3, dz * 1.3, 3) * 1.5;
      const n = fbm(dx * 2.1 + w, dy * 2.1 + w, dz * 2.1 + w + 3, 5);
      const bd = (dy * .9 + dx * .35 - .08) * 2.6, band = Math.exp(-bd * bd);              /* faint galactic band */
      let d = Math.min(1, Math.max(0, (n - .44) * 3.3) * (.4 + .95 * band));
      const dust = fbm(dx * 5 + 11, dy * 5, dz * 5, 4);
      d *= .55 + .9 * dust;
      const tt = Math.min(.999, Math.max(0, fbm(dx * 1.1 - 4, dy * 1.1 + 2, dz * 1.1, 3) * 1.35 - .12)) * 3, i = tt | 0, f = tt - i, c1 = PAL[i], c2 = PAL[i + 1];
      const k = d * d * .78 + d * .08, base = 7 + dust * 9, o = (y * nw + x) * 4;
      px[o] = Math.min(255, base + mix(c1[0], c2[0], f) * k);
      px[o + 1] = Math.min(255, base + mix(c1[1], c2[1], f) * k * .95);
      px[o + 2] = Math.min(255, base + 2 + mix(c1[2], c2[2], f) * k);
      px[o + 3] = 255;
    }
  }
  sg.putImageData(img, 0, 0);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.drawImage(small, 0, 0, W, H);

  /* stars: uniform on the sphere, stretched horizontally toward the poles so they stay round when viewed */
  const N = Math.round(W * H / 850);
  for (let i = 0; i < N; i++) {
    const x = rnd() * W, colat = Math.acos(1 - 2 * rnd()), y = colat / Math.PI * H, m = rnd(), stretch = 1 / Math.max(.18, Math.sin(colat));
    const r = .45 + 1.7 * Math.pow(m, 7) * (W / 2048), cr = rnd(), col = cr < .08 ? [165, 200, 255] : cr < .2 ? [255, 222, 190] : [255, 255, 255];
    const a = .35 + .65 * Math.pow(m, .5), glow = r > 1.3 ? r * 4.5 : 0;
    for (const ox of (x < glow * stretch * 2 ? [0, W] : x > W - glow * stretch * 2 ? [0, -W] : [0])) {
      g.save(); g.translate(x + ox, y); g.scale(stretch, 1);

      g.fillStyle = `rgba(${col},${a})`; g.beginPath(); g.arc(0, 0, r, 0, 6.2832); g.fill(); g.restore();
    }

/* Reflection environment for the chrome: the sky itself plus a few bright light panels (white softbox, warm amber, cool blue).
   Chrome only looks like chrome when it has bright shapes to reflect — a pure black sky alone would give black metal. */
function buildEnv(renderer, skyTex) {
  const es = new THREE.Scene(), dg = new THREE.SphereGeometry(50, 48, 32); dg.scale(-1, 1, 1);
  es.add(new THREE.Mesh(dg, new THREE.MeshBasicMaterial({ map: skyTex, toneMapped: false })));
  const panel = (w, h, col, x, y, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide, toneMapped: false })); m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m); };
  panel(46, 9, new THREE.Color(5.5, 5.5, 6), 0, 24, 16);          /* top softbox */
  panel(7, 36, new THREE.Color(4.6, 2.5, 1.1), -26, 0, 11);       /* warm amber strip, left */
  panel(7, 36, new THREE.Color(1.5, 2.7, 5), 26, 2, 9);           /* cool blue strip, right */
  panel(3, 30, new THREE.Color(5, 5, 5), -9, 0, 22);              /* thin white edge-light */
  panel(3, 30, new THREE.Color(4, 4, 4.4), 12, 0, 21);
  panel(40, 5, new THREE.Color(3, 2.6, 2.4), 0, -15, 19);         /* low warm fill */
  const pm = new THREE.PMREMGenerator(renderer), rt = pm.fromScene(es, .02); pm.dispose();
  es.traverse(o => { o.geometry && o.geometry.dispose(); o.material && o.material.dispose(); });   /* free the temporary scene; skyTex stays for the visible dome */
  return rt.texture;
}

/* sky: load the panorama from SKY_URL when served over http(s). Opened straight from disk (file://) browsers
   block WebGL from using local image files, so the procedural sky is used there. Any failure → procedural sky. */
function loadSky(done) {
  if (!SKY_URL || !/^https?:/.test(location.protocol)) return done(null);
  new THREE.TextureLoader().load(SKY_URL, done, undefined, () => { console.info("[JEE.DSGNS] " + SKY_URL + " not found — using the generated 360° sky. Add your panorama at that path to use it."); done(null); });
}
function fail() {   /* only when WebGL / Three.js genuinely cannot run */
  document.body.classList.add("nogl");
  try { document.body.style.backgroundImage = `url(${makeSkyCanvas(1536, 768).toDataURL("image/jpeg", .82)})`; } catch (e) {}
  const f = () => hint.classList.add("on"); window.gsap ? gsap.to(hint, { opacity: .6, duration: 1, delay: 1 }) : 0; setTimeout(f, 1500);
}

(function init() {
  if (!window.THREE || !window.gsap) return fail();

  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
  const scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, 1, .1, 200); camera.rotation.order = "YXZ"; scene.add(camera);

  /* chrome logo (child of the camera, so it stays centered while the sky moves around it) */
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: .1, envMapIntensity: 1.7 });
  const logo = new THREE.Group();
  const P = a => { const o = []; for (let i = 0; i < a.length; i += 2) o.push(new THREE.Vector2((a[i] - W / 2) * S, -(a[i + 1] - H / 2) * S)); return o; };
  SHAPES.forEach(s => {
    const sh = new THREE.Shape(P(s[0])); for (let i = 1; i < s.length; i++) sh.holes.push(new THREE.Path(P(s[i])));
    const geo = new THREE.ExtrudeGeometry(sh, { depth: .2, bevelEnabled: true, bevelThickness: .045, bevelSize: .014, bevelOffset: -.014, bevelSegments: 5, curveSegments: 1 });
    geo.translate(0, 0, -.1); logo.add(new THREE.Mesh(geo, mat));
  });
  group = new THREE.Group(); group.add(logo); camera.add(group);
  const hit = new THREE.Mesh(new THREE.BoxGeometry(6.2, .9, .6), new THREE.MeshBasicMaterial({ visible: false })); group.add(hit);
  const l1 = new THREE.DirectionalLight(0xffffff, 1.1); l1.position.set(3, 4, 5); scene.add(l1);
  const l2 = new THREE.DirectionalLight(0x7fb0ff, 1.2); l2.position.set(-5, 1, -3); scene.add(l2);
  const l3 = new THREE.DirectionalLight(0xffc89a, 1.3); l3.position.set(-4, 2, 6); scene.add(l3);   /* warm rim/edge light */

  state = { blend: 0 };
  const m = { x: 0, y: 0, tx: 0, ty: 0 }, drag = { yaw: 0, pitch: 0 };
  const AMP = REDUCED ? .1 : 1, clampN = (v, a, b) => Math.min(b, Math.max(a, v));

  /* cursor / touch-drag -> view direction */
  addEventListener("pointermove", e => {
    if (e.pointerType === "mouse") { m.tx = e.clientX / innerWidth * 2 - 1; m.ty = e.clientY / innerHeight * 2 - 1; }
  });
  let last = null;
  canvas.addEventListener("pointerdown", e => { if (e.pointerType === "touch") { last = [e.clientX, e.clientY]; drag.moved = 0; } });
  addEventListener("pointermove", e => { if (e.pointerType === "touch" && last) { drag.moved += Math.abs(e.clientX - last[0]) + Math.abs(e.clientY - last[1]); drag.yaw += (e.clientX - last[0]) * .0035 * AMP; drag.pitch = clampN(drag.pitch + (e.clientY - last[1]) * .0035 * AMP, -.4, .4); last = [e.clientX, e.clientY]; } });
  addEventListener("pointerup", () => last = null);

  let baseZ = 12;
  function resize() {
    const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
    baseZ = Math.max(6.4 / (2 * Math.tan(camera.fov * Math.PI / 360) * camera.aspect * (w < 700 ? .92 : .72)), 6);
    camera.updateProjectionMatrix(); if (!entering) group.position.z = -baseZ;
  }
  addEventListener("resize", resize); resize();

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function onLogo(e) { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); camera.updateMatrixWorld(); ray.setFromCamera(ndc, camera); return ray.intersectObject(hit).length > 0; }
  canvas.addEventListener("pointermove", e => document.body.classList.toggle("hover", onLogo(e)));
  addEventListener("dblclick", e => { if (onLogo(e)) enter(); });                                   /* desktop: double-click only */
  addEventListener("pointerup", e => { if (e.pointerType === "touch" && onLogo(e) && (drag.moved || 0) < 8) enter(); }); /* touch: tap */

  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, clock = new THREE.Clock();
  let sky = null;
  function start(tex) {
    /* a sky ALWAYS exists: your panorama if it loaded, otherwise the generated one (never flat black) */
    const skyTex = tex || new THREE.CanvasTexture(makeSkyCanvas(TOUCH ? 1024 : 2048, TOUCH ? 512 : 1024));
    skyTex.encoding = THREE.sRGBEncoding; skyTex.wrapS = THREE.RepeatWrapping;
    skyTex.generateMipmaps = false; skyTex.minFilter = THREE.LinearFilter;   /* no mipmaps → no hairline at the wrap seam */
    const g = new THREE.SphereGeometry(100, 64, 40); g.scale(-1, 1, 1);      /* equirect UVs on an inside-out sphere around the camera */
    sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: skyTex, toneMapped: false, depthWrite: false }));
    sky.renderOrder = -1; sky.frustumCulled = false; scene.add(sky);
    scene.environment = buildEnv(renderer, skyTex);                           /* THIS is what makes the logo chrome instead of black */
    (function loop() {
      requestAnimationFrame(loop);
      const t = REDUCED ? 0 : clock.getElapsedTime();
      m.x += (m.tx - m.x) * .06; m.y += (m.ty - m.y) * .06;
      /* view direction: eased toward the target so it glides instead of snapping; pitch is clamped */
      const ty = -m.tx * .55 * AMP + drag.yaw + t * .008, tp = clampN(-m.ty * .3 * AMP + drag.pitch, -.4, .4);
      camera.rotation.y += (ty - camera.rotation.y) * .04; camera.rotation.x += (tp - camera.rotation.x) * .04;
      const cyc = t % 24, spin = Math.PI * 2 * ease(Math.min(Math.max((cyc - 18.5) / 5.5, 0), 1));
      const auto = Math.sin(t * .38) * .55 + spin, front = Math.round(auto / (Math.PI * 2)) * Math.PI * 2, k = state.blend;
      group.rotation.y = auto * (1 - k) + front * k + m.x * .3 * (1 - k);
      group.rotation.x = (Math.sin(t * .6) * .05 + m.y * .15) * (1 - k);
      group.rotation.z = Math.sin(t * .5) * .012;
      if (!entering) group.position.y = Math.sin(t * .9) * .09;
      renderer.render(scene, camera);
    })();
    gsap.to(canvas, { opacity: 1, duration: 2.2, delay: .2, ease: "power2.out" });
    gsap.fromTo(group.position, { z: -baseZ * 1.25 }, { z: -baseZ, duration: 3, delay: .2, ease: "power3.out" });
    gsap.delayedCall(1.8, () => hint.classList.add("on")); gsap.to(hint, { opacity: .6, duration: 1, delay: 1.8 });
  }
  loadSky(start);
})();
</script>
</body>
